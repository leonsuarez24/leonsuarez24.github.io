<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Leon Suarez-Rodriguez — synthwave LS monogram</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080712"/>
      <stop offset="0.58" stop-color="#171034"/>
      <stop offset="1" stop-color="#071a25"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#57e8f2"/>
      <stop offset="0.5" stop-color="#3dff9d"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
    <filter id="cyanGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="5" fill="url(#night)" stroke="url(#frame)" stroke-width="2"/>
  <circle cx="47" cy="17" r="11" fill="url(#sun)" filter="url(#pinkGlow)"/>
  <g stroke="#171034" stroke-width="2">
    <path d="M36 14H58M36 19H58M38 24H56"/>
  </g>

  <g fill="none" stroke="#3dff9d" stroke-width="0.8" opacity="0.58">
    <path d="M3 43H61M3 50H61M3 58H61M32 40V63M18 40L9 63M46 40L55 63"/>
  </g>
  <path d="M3 40H61" stroke="#57e8f2" stroke-width="1.5" filter="url(#cyanGlow)"/>

  <path d="M11 14V46H28" fill="none" stroke="#57e8f2" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" filter="url(#cyanGlow)"/>
  <path d="M52 16H34V30H52V46H33" fill="none" stroke="#ff4fa3" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" filter="url(#pinkGlow)"/>
</svg>
